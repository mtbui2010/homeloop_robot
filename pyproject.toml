[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "homeloop-robot"
version = "0.1.0"
description = "A stochastic mock household robot: full skill set, no motion, skills return calibrated successes and failures; simulated user and human-aware safety."
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["pyyaml>=6"]

[tool.setuptools.packages.find]
include = ["homeloop_robot*"]

[tool.setuptools.package-data]
homeloop_robot = ["houses/*.yaml", "profiles/*/*.yaml", "configs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
