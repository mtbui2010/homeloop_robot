  - {id: mug_2, cls: mug, attrs: {color: blue, owner: partner_b}, at: table@kitchen, alt: [nightstand@bedroom]}
  - {id: glass_1, cls: glass, attrs: {color: white}, at: upper_cabinet@kitchen, alt: [table@kitchen]}
  - {id: plate_1, cls: plate, attrs: {color: white}, at: counter@kitchen, alt: [table@kitchen]}
  - {id: milk_1, cls: milk, attrs: {color: white}, at: fridge@kitchen, alt: [table@kitchen]}
  - {id: orange_1, cls: orange, attrs: {color: orange}, at: table@kitchen, alt: [fridge@kitchen, coffee_table@living]}
  - {id: kimchi_box_1, cls: kimchi_box, attrs: {color: red}, at: fridge@kitchen, alt: [counter@kitchen]}
  - {id: kitchen_knife_1, cls: knife, attrs: {color: black}, at: drawer@kitchen, alt: [counter@kitchen]}
  - {id: cooking_oil_1, cls: cooking_oil, attrs: {color: yellow}, at: counter@kitchen, alt: [upper_cabinet@kitchen]}
  - {id: remote_1, cls: remote, attrs: {color: black}, at: coffee_table@living, alt: [sofa@living, tv_stand@living]}
  - {id: phone_1, cls: phone, attrs: {color: black, owner: partner_a}, at: coffee_table@living, alt: [sofa@living]}
  - {id: phone_2, cls: phone, attrs: {color: white, owner: partner_b}, at: nightstand@bedroom, alt: [coffee_table@living]}
  - {id: glasses_1, cls: glasses, attrs: {color: brown}, at: nightstand@bedroom, alt: [coffee_table@living]}
  - {id: book_1, cls: book, attrs: {color: blue}, at: nightstand@bedroom, alt: [reading_chair@bedroom, coffee_table@living]}
  - {id: book_2, cls: book, attrs: {color: yellow}, at: tv_stand@living, alt: [nightstand@bedroom]}
  - {id: towel_1, cls: towel, attrs: {color: white}, at: bath_cabinet@bathroom, alt: [sink@bathroom]}
  - {id: towel_2, cls: towel, attrs: {color: pink}, at: dresser@bedroom, alt: [bath_cabinet@bathroom]}
  - {id: detergent_1, cls: detergent, attrs: {color: green}, at: bath_cabinet@bathroom, alt: []}
  - {id: keys_1, cls: keys, attrs: {color: gray}, at: shoe_cabinet@living, alt: [coffee_table@living]}
  - {id: wallet_1, cls: wallet, attrs: {color: brown}, at: shoe_cabinet@living, alt: [nightstand@bedroom]}
  - {id: matches_1, cls: matches, attrs: {color: red}, at: drawer@kitchen, alt: []}
  - {id: houseplant_1, cls: houseplant, attrs: {color: green}, at: tv_stand@living, alt: []}
people:
  - {id: partner_a, role: user, name: {en: wife, ko: 아내}, aliases: {en: [me, my wife], ko: [나, 와이프]},
     age_group: "30-39", sex: female, child: false, seat: sofa@living, pos: [0.5, 0.5], alt_seats: [bed@bedroom]}
  - {id: partner_b, role: other, name: {en: husband, ko: 남편}, aliases: {en: [my husband], ko: [신랑]},
     age_group: "30-39", sex: male, child: false, seat: reading_chair@bedroom, pos: [4.5, 7.5], alt_seats: []}
robot: {start: dock@living, dock: dock@living}
