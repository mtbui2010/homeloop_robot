     pos: [7.0, 2.6], yaw_deg: 90, height_m: 0.75, clutter: medium, capacity: 6, tags: []}
  upper_cabinet@kitchen:
    {room: kitchen, kind: surface, name: {en: upper shelf, ko: 찬장}, aliases: {en: [top shelf], ko: [위 찬장]},
     pos: [5.7, 3.3], yaw_deg: 90, height_m: 1.45, clutter: low, capacity: 4, tags: [high_shelf]}
  kitchen_sink@kitchen:
    {room: kitchen, kind: surface, name: {en: kitchen sink, ko: 개수대}, aliases: {en: [sink], ko: [싱크볼]},
     pos: [6.8, 1.5], yaw_deg: 270, height_m: 0.85, clutter: medium, capacity: 4, tags: [wet, food_prep]}
  bed@bedroom:
    {room: bedroom, kind: seat, name: {en: bed, ko: 침대}, aliases: {en: [], ko: []},
     pos: [1.5, 5.6], yaw_deg: 180, height_m: 0.5, clutter: low, capacity: 4, tags: [], person_pos: [0.5, 7.4]}
  reading_chair@bedroom:
    {room: bedroom, kind: seat, name: {en: reading chair, ko: 독서 의자}, aliases: {en: [armchair], ko: [안락의자]},
     pos: [3.4, 6.6], yaw_deg: 0, height_m: 0.45, clutter: low, capacity: 1, tags: []}
  nightstand@bedroom:
    {room: bedroom, kind: surface, name: {en: nightstand, ko: 협탁}, aliases: {en: [bedside table], ko: [침대 옆 탁자]},
     top: [0.9, 7.0], pos: [1.75, 6.9], yaw_deg: 173, height_m: 0.6, clutter: medium, capacity: 4, tags: [electrical]}
  dresser@bedroom:
    {room: bedroom, kind: container, container: {type: drawer, openable: true, opened: false},
     name: {en: dresser, ko: 서랍장}, aliases: {en: [], ko: []},
     pos: [3.6, 4.8], yaw_deg: 0, height_m: 0.9, clutter: low, capacity: 6, tags: []}
  sink@bathroom:
    {room: bathroom, kind: surface, name: {en: bathroom sink, ko: 세면대}, aliases: {en: [sink], ko: []},
     pos: [7.3, 5.2], yaw_deg: 0, height_m: 0.85, clutter: medium, capacity: 4, tags: [wet]}
  bath_cabinet@bathroom:
    {room: bathroom, kind: container, container: {type: cabinet, openable: true, opened: false},
     name: {en: bathroom cabinet, ko: 욕실 수납장}, aliases: {en: [], ko: [수납장]},
     pos: [6.0, 6.3], yaw_deg: 90, height_m: 1.2, clutter: low, capacity: 5, tags: [], hard_nav: true}
objects:
