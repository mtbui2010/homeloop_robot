# A couple's flat: living room, bedroom, kitchen, bathroom. Two people: who gets the message / object.
house: couple_flat
version: 1
name: {en: Couple's flat, ko: 신혼집}
rooms:
  living:   {type: [living], name: {en: living room, ko: 거실}, rect: [0, 0, 5, 4], floor: {pos: [3.0, 2.2], tags: [exit_path]}}
  kitchen:  {type: [kitchen, dining], name: {en: kitchen, ko: 주방}, rect: [5, 0, 9, 4], floor: {pos: [6.6, 2.2]}}
  bedroom:  {type: [bedroom], name: {en: bedroom, ko: 침실}, rect: [0, 4, 5, 8], floor: {pos: [2.6, 5.6], tags: [carpet]}}
  bathroom: {type: [bathroom], name: {en: bathroom, ko: 욕실}, rect: [5, 4, 8, 7], floor: {pos: [6.4, 5.2]}}
doors:
  - {rooms: [living, kitchen], at: [5.0, 2.2], width_m: 1.0}
  - {rooms: [living, bedroom], at: [3.0, 4.0], width_m: 0.8}
  - {rooms: [kitchen, bathroom], at: [6.5, 4.0], width_m: 0.7}
places:
  sofa@living:
    {room: living, kind: seat, name: {en: sofa, ko: 소파}, aliases: {en: [couch], ko: [쇼파]},
     pos: [1.9, 0.9], yaw_deg: 200, height_m: 0.45, clutter: medium, capacity: 3, tags: [], person_pos: [0.5, 0.5]}
  coffee_table@living:
    {room: living, kind: surface, name: {en: coffee table, ko: 거실 탁자}, aliases: {en: [low table], ko: [탁자]},
     pos: [3.2, 1.0], yaw_deg: 270, height_m: 0.45, clutter: medium, capacity: 6, tags: []}
  side_table@living:
    {room: living, kind: surface, name: {en: side table, ko: 보조 탁자}, aliases: {en: [end table], ko: [사이드 테이블]},
     top: [0.85, 0.85], pos: [1.4, 1.5], yaw_deg: 225, height_m: 0.55, clutter: low, capacity: 3, tags: []}
  tv_stand@living:
    {room: living, kind: surface, name: {en: TV stand, ko: TV 받침대}, aliases: {en: [tv cabinet], ko: [티비장]},
     pos: [1.6, 3.2], yaw_deg: 90, height_m: 0.5, clutter: low, capacity: 4, tags: [electrical]}
  shoe_cabinet@living:
    {room: living, kind: container, container: {type: cabinet, openable: true, opened: false},
     name: {en: shoe cabinet, ko: 신발장}, aliases: {en: [], ko: []},
     pos: [4.3, 3.3], yaw_deg: 0, height_m: 1.0, clutter: low, capacity: 4, tags: [exit_path], hard_nav: true}
  dock@living:
    {room: living, kind: dock, name: {en: charging dock, ko: 충전기}, aliases: {en: [dock, charger], ko: [충전 스테이션]},
     pos: [4.2, 0.6], yaw_deg: 0, height_m: 0.0, clutter: low, capacity: 0, tags: []}
  counter@kitchen:
    {room: kitchen, kind: surface, name: {en: counter, ko: 조리대}, aliases: {en: [kitchen counter], ko: [싱크대]},
     pos: [6.4, 0.8], yaw_deg: 270, height_m: 0.9, clutter: medium, capacity: 6, tags: [food_prep, wet]}
  stove@kitchen:
    {room: kitchen, kind: surface, name: {en: stove, ko: 가스레인지}, aliases: {en: [cooktop], ko: [레인지]},
     pos: [8.2, 1.0], yaw_deg: 0, height_m: 0.9, clutter: low, capacity: 2, tags: [heat_source]}
  fridge@kitchen:
    {room: kitchen, kind: container, container: {type: fridge, openable: true, opened: false},
     name: {en: fridge, ko: 냉장고}, aliases: {en: [refrigerator], ko: []},
     pos: [8.2, 3.2], yaw_deg: 0, height_m: 1.2, clutter: medium, capacity: 8, tags: [food_storage]}
  microwave@kitchen:
    {room: kitchen, kind: container, container: {type: appliance, openable: true, opened: false},
     name: {en: microwave, ko: 전자레인지}, aliases: {en: [], ko: []},
     pos: [7.3, 0.8], yaw_deg: 270, height_m: 1.0, clutter: low, capacity: 1, tags: [electrical]}
  drawer@kitchen:
    {room: kitchen, kind: container, container: {type: drawer, openable: true, opened: false},
     name: {en: kitchen drawer, ko: 주방 서랍}, aliases: {en: [drawer], ko: [서랍]},
     pos: [5.6, 1.0], yaw_deg: 270, height_m: 0.8, clutter: medium, capacity: 6, tags: []}
